<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V-OMEGA: QUANTUM CHAOS 2.0</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background-color: #000;
            color: #00ffcc;
            font-family: 'Fira Code', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
            background: radial-gradient(circle at center, #0a1424 0%, #000000 100%);
        }

        /* Lưới không gian 3D giả lập */
        .grid-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(0, 255, 204, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 204, 0.04) 1px, transparent 1px);
            background-size: 40px 40px;
            transform: perspective(600px) rotateX(60deg) translateY(-100px) translateZ(-200px);
            animation: gridMove 15s linear infinite;
            z-index: 0;
        }

        @keyframes gridMove {
            0% { transform: perspective(600px) rotateX(60deg) translateY(0) translateZ(-200px); }
            100% { transform: perspective(600px) rotateX(60deg) translateY(40px) translateZ(-200px); }
        }

        .container {
            position: relative;
            z-index: 10;
            background: rgba(4, 13, 33, 0.85);
            padding: 35px;
            border-radius: 6px;
            box-shadow: 0 0 50px rgba(0, 255, 204, 0.15), inset 0 0 20px rgba(0, 255, 204, 0.05);
            width: 100%;
            max-width: 700px;
            border: 1px solid rgba(0, 255, 204, 0.4);
            backdrop-filter: blur(12px);
        }

        h1 {
            color: #fff;
            font-size: 32px;
            text-align: center;
            margin-bottom: 10px;
            letter-spacing: 5px;
            text-shadow: 0 0 20px #00ffcc, 0 0 40px #00ffcc;
        }

        .subtitle {
            text-align: center;
            font-size: 12px;
            color: #f50057;
            margin-bottom: 30px;
            letter-spacing: 3px;
            text-transform: uppercase;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

        input {
            width: 100%;
            padding: 18px;
            background-color: rgba(0, 0, 0, 0.7);
            border: 1px solid #00ffcc;
            color: #fff;
            font-size: 18px;
            font-family: 'Fira Code', monospace;
            text-align: center;
            outline: none;
            text-transform: uppercase;
            letter-spacing: 3px;
            transition: 0.3s;
        }
        
        input:focus {
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.5);
            border-color: #fff;
        }

        button {
            width: 100%;
            padding: 16px;
            margin-top: 20px;
            background: linear-gradient(90deg, #00ffcc, #00b3ff);
            color: #000;
            border: none;
            font-size: 20px;
            font-family: 'Fira Code', monospace;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 4px;
        }

        button:hover {
            transform: scale(1.02);
            box-shadow: 0 0 35px rgba(0, 255, 204, 0.7);
        }

        /* Màn hình phân tích cực gắt */
        .analyzer-screen {
            display: none;
            margin-top: 25px;
            background: #02060f;
            border: 1px solid #333;
            padding: 15px;
            height: 250px;
            overflow-y: hidden;
            position: relative;
            box-shadow: inset 0 0 15px rgba(0,0,0,1);
        }

        .code-lines {
            font-size: 12px;
            color: #00ffcc;
            line-height: 1.5;
            opacity: 0.9;
        }

        .math-equation { color: #ffeb3b; }
        .danger-txt { color: #f50057; font-weight: bold;}
        .highlight-txt { color: #00b3ff; }

        /* Kết quả hiển thị Glitch */
        .final-box {
            display: none;
            margin-top: 25px;
            text-align: center;
            padding: 30px 10px;
            background: rgba(0,0,0,0.8);
            border-top: 2px solid #00ffcc;
            border-bottom: 2px solid #00ffcc;
            position: relative;
        }

        .result-main {
            font-size: 75px;
            font-weight: bold;
            letter-spacing: 12px;
            margin-bottom: 5px;
        }

        .result-sub {
            font-size: 30px;
            letter-spacing: 6px;
        }

        .glitch-tai { color: #00ffcc; text-shadow: 3px 3px 0px #f50057, -3px -3px 0px #00b3ff; }
        .glitch-xiu { color: #f50057; text-shadow: 3px 3px 0px #00ffcc, -3px -3px 0px #ffeb3b; }
        
        .glitch-chan { color: #ffeb3b; }
        .glitch-le { color: #b388ff; }

        .shake { animation: shake 0.4s infinite; }
        @keyframes shake {
            0% { transform: translate(2px, 1px) rotate(0deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            40% { transform: translate(1px, -2px) rotate(1deg); }
            60% { transform: translate(-3px, 2px) rotate(0deg); }
            80% { transform: translate(-1px, -2px) rotate(2deg); }
            100% { transform: translate(2px, -1px) rotate(-1deg); }
        }

        .stats {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #666;
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="grid-bg"></div>

    <div class="container">
        <h1>V-OMEGA CORE 2.0</h1>
        <div class="subtitle">WARNING: HÉNON STRANGE ATTRACTOR ACTIVE</div>
        
        <input type="text" id="md5Input" placeholder="INPUT 32-BIT MD5 HASH" maxlength="32">
        <button onclick="executeOmega()" id="btnExecute">EXECUTE QUANTUM MATH</button>

        <div class="analyzer-screen" id="analyzerScreen">
            <div id="codeConsole" class="code-lines"></div>
        </div>

        <div class="final-box" id="resultBox">
            <div id="resTaiXiu" class="result-main"></div>
            <div id="resChanLe" class="result-sub"></div>
            
            <div class="stats">
                <span id="entropyStat">MAGNITUDE: 0.0000</span>
                <span id="chaosStat">PARITY: 0x00</span>
            </div>
        </div>
    </div>

    <script>
        async function sha256(message) {
            const msgBuffer = new TextEncoder().encode(message);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        function pushLog(text, type = "normal") {
            const cons = document.getElementById('codeConsole');
            let className = "";
            if (type === "math") className = "math-equation";
            if (type === "danger") className = "danger-txt";
            if (type === "highlight") className = "highlight-txt";
            
            cons.innerHTML += `<div class="${className}">[${(new Date()).toISOString().substring(11,23)}] ${text}</div>`;
            cons.scrollTop = cons.scrollHeight;
        }

        const sleep = ms => new Promise(r => setTimeout(r, ms));

        async function executeOmega() {
            const inputVal = document.getElementById('md5Input').value.trim().toLowerCase();
            if (!/^[a-f0-9]{32}$/.test(inputVal)) {
                alert("CRITICAL ERROR: Dữ liệu không hợp lệ. Vui lòng nhập đúng 32 ký tự MD5.");
                return;
            }

            // Reset UI
            document.getElementById('btnExecute').style.display = 'none';
            document.getElementById('resultBox').style.display = 'none';
            document.getElementById('analyzerScreen').style.display = 'block';
            const cons = document.getElementById('codeConsole');
            cons.innerHTML = "";

            // BƯỚC 1: BĂM KÉP SHA-256
            pushLog("INITIATING QUANTUM HASHING...", "highlight");
            await sleep(300);
            const shaHash = await sha256(inputVal);
            pushLog(`SHA-256 GENERATED: ${shaHash.substring(0, 24)}...`);
            await sleep(300);
            
            // BƯỚC 2: XOR-FOLDING (Chia khối và gập dữ liệu)
            pushLog("PERFORMING BITWISE XOR-FOLDING MATRIX...", "math");
            let chunks = [];
            for (let i = 0; i < 8; i++) {
                chunks.push(parseInt(shaHash.substring(i * 8, i * 8 + 8), 16));
            }
            
            // Tạo Hạt giống Lõi (Core Seeds) từ việc XOR các khối đối xứng
            let alpha = chunks[0] ^ chunks[4];
            let beta = chunks[1] ^ chunks[5];
            let gamma = chunks[2] ^ chunks[6];
            let delta = chunks[3] ^ chunks[7];
            
            pushLog(`CORE SEEDS: α=${alpha.toString(16)} | β=${beta.toString(16)}`);
            await sleep(400);

            // BƯỚC 3: HỆ HÉNON (HÉNON MAP STRANGE ATTRACTOR - 2D CHAOS)
            pushLog("INJECTING HÉNON STRANGE ATTRACTOR...", "danger");
            
            // Tham số hỗn loạn chuẩn (a ≈ 1.4, b ≈ 0.3) cộng thêm nhiễu từ Hash
            let a = 1.4 + ((alpha % 10000) / 100000); 
            let b = 0.3 + ((beta % 10000) / 100000); 
            
            // Điểm khởi tạo x, y
            let x = (gamma % 10000) / 10000; 
            let y = (delta % 10000) / 10000; 

            pushLog(`ƒ(Xn+1) = 1 - ${a.toFixed(4)}Xn² + Yn`, "math");
            pushLog(`ƒ(Yn+1) = ${b.toFixed(4)}Xn`, "math");
            await sleep(400);
            
            // Chạy vòng lặp hỗn loạn 100 lần
            for(let i=1; i<=100; i++) {
                let next_x = 1 - a * x * x + y;
                let next_y = b * x;
                x = next_x;
                y = next_y;
                
                if (i % 25 === 0) {
                    pushLog(`Vector ${i}: [ ${x.toFixed(6)}, ${y.toFixed(6)} ]`);
                    await sleep(100);
                }
            }

            // BƯỚC 4: RÚT TRÍCH ENTROPY VÀ SỤP ĐỔ HÀM SÓNG (WAVE FUNCTION COLLAPSE)
            pushLog("ANALYZING WAVE AMPLITUDE & PARITY...", "highlight");
            await sleep(400);

            // Logic Tài/Xỉu: Dựa vào Biên độ (Magnitude) tuyệt đối của X
            // Sau 100 vòng lặp, lấy phần thập phân của |X| để đánh giá năng lượng
            let magnitude = Math.abs(x);
            let fractionalEnergy = magnitude - Math.floor(magnitude); 
            pushLog(`MAGNITUDE = ${fractionalEnergy.toFixed(6)} (Threshold: 0.500000)`, "math");

            // Logic Chẵn/Lẻ: Dựa vào Tính chẵn lẻ (Parity) của giá trị tọa độ không gian gộp
            // Nhân Y với một hằng số lớn, lấy phần nguyên và kiểm tra bit cuối (Chẵn hay Lẻ)
            let spatialEntropy = Math.floor(Math.abs(y * 10000000));
            pushLog(`SPATIAL ENTROPY = ${spatialEntropy} => PARITY CHECK`, "math");
            
            await sleep(500);
            pushLog("COLLAPSING SUPERPOSITION...", "danger");
            await sleep(500);

            // HIỂN THỊ KẾT QUẢ
            document.getElementById('analyzerScreen').style.display = 'none';
            document.getElementById('resultBox').style.display = 'block';
            
            // Hiệu ứng rung gắt
            document.getElementById('resultBox').classList.add('shake');
            setTimeout(() => document.getElementById('resultBox').classList.remove('shake'), 600);

            // Định đoạt Tài / Xỉu
            const txNode = document.getElementById('resTaiXiu');
            if (fractionalEnergy > 0.5) {
                txNode.textContent = "TÀI";
                txNode.className = "result-main glitch-tai";
            } else {
                txNode.textContent = "XỈU";
                txNode.className = "result-main glitch-xiu";
            }

            // Định đoạt Chẵn / Lẻ
            const clNode = document.getElementById('resChanLe');
            if (spatialEntropy % 2 === 0) {
                clNode.textContent = "{ CHẴN }";
                clNode.className = "result-sub glitch-chan";
            } else {
                clNode.textContent = "{ LẺ }";
                clNode.className = "result-sub glitch-le";
            }

            // Cập nhật thông số kỹ thuật (Decor)
            document.getElementById('entropyStat').textContent = `MAGNITUDE: ${fractionalEnergy.toFixed(5)}`;
            document.getElementById('chaosStat').textContent = `PARITY: 0x${spatialEntropy.toString(16).toUpperCase()}`;

            // Reset Nút
            document.getElementById('btnExecute').style.display = 'block';
            document.getElementById('btnExecute').textContent = "DECODE NEW HASH";
        }
    </script>
</body>
</html>
