<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V-OMEGA: QUANTUM CHAOS</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background-color: #000;
            color: #00ffcc;
            font-family: 'Fira Code', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
            background: radial-gradient(circle at center, #0a192f 0%, #000000 100%);
        }

        /* Lưới không gian 3D giả lập */
        .grid-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(0, 255, 204, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 204, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            transform: perspective(500px) rotateX(60deg) translateY(-100px) translateZ(-200px);
            animation: gridMove 10s linear infinite;
            z-index: 0;
        }

        @keyframes gridMove {
            0% { transform: perspective(500px) rotateX(60deg) translateY(0) translateZ(-200px); }
            100% { transform: perspective(500px) rotateX(60deg) translateY(30px) translateZ(-200px); }
        }

        .container {
            position: relative;
            z-index: 10;
            background: rgba(4, 13, 33, 0.85);
            padding: 35px;
            border-radius: 4px;
            box-shadow: 0 0 50px rgba(0, 255, 204, 0.1), inset 0 0 20px rgba(0, 255, 204, 0.05);
            width: 100%;
            max-width: 650px;
            border: 1px solid rgba(0, 255, 204, 0.3);
            backdrop-filter: blur(10px);
        }

        h1 {
            color: #fff;
            font-size: 28px;
            text-align: center;
            margin-bottom: 20px;
            letter-spacing: 4px;
            text-shadow: 0 0 15px #00ffcc;
        }

        .subtitle {
            text-align: center;
            font-size: 11px;
            color: #f50057;
            margin-bottom: 30px;
            letter-spacing: 2px;
            text-transform: uppercase;
            animation: pulse 2s infinite;
        }

        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        input {
            width: 100%;
            padding: 18px;
            background-color: rgba(0,0,0,0.5);
            border: 1px solid #00ffcc;
            color: #fff;
            font-size: 18px;
            font-family: 'Fira Code', monospace;
            text-align: center;
            outline: none;
            text-transform: uppercase;
            letter-spacing: 3px;
        }
        
        input:focus {
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.4);
            border-color: #fff;
        }

        button {
            width: 100%;
            padding: 16px;
            margin-top: 20px;
            background: linear-gradient(90deg, #00ffcc, #00b3ff);
            color: #000;
            border: none;
            font-size: 20px;
            font-family: 'Fira Code', monospace;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 4px;
        }

        button:hover {
            transform: scale(1.02);
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.6);
        }

        /* Màn hình phân tích cực gắt */
        .analyzer-screen {
            display: none;
            margin-top: 25px;
            background: #000;
            border: 1px solid #333;
            padding: 15px;
            height: 220px;
            overflow-y: hidden;
            position: relative;
        }

        .code-lines {
            font-size: 11px;
            color: #00ffcc;
            line-height: 1.4;
            opacity: 0.8;
        }

        .math-equation { color: #ffeb3b; }
        .danger-txt { color: #f50057; }

        /* Kết quả hiển thị Glitch */
        .final-box {
            display: none;
            margin-top: 25px;
            text-align: center;
            padding: 30px 10px;
            background: rgba(0,0,0,0.6);
            border-top: 2px solid #00ffcc;
            border-bottom: 2px solid #00ffcc;
            position: relative;
        }

        .result-main {
            font-size: 70px;
            font-weight: bold;
            letter-spacing: 10px;
            margin-bottom: 10px;
        }

        .result-sub {
            font-size: 28px;
            letter-spacing: 5px;
        }

        .glitch-tai { color: #00ffcc; text-shadow: 2px 2px 0px #f50057, -2px -2px 0px #00b3ff; }
        .glitch-xiu { color: #f50057; text-shadow: 2px 2px 0px #00ffcc, -2px -2px 0px #ffeb3b; }
        
        .glitch-chan { color: #ffeb3b; }
        .glitch-le { color: #b388ff; }

        /* Hiệu ứng rung nhẹ liên tục */
        .shake { animation: shake 0.5s infinite; }
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }

        .stats {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            color: #888;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="grid-bg"></div>

    <div class="container">
        <h1>V-OMEGA CORE</h1>
        <div class="subtitle">WARNING: LOGISTIC MAP & CHAOS THEORY ACTIVE</div>
        
        <input type="text" id="md5Input" placeholder="INPUT HASH SEQUENCE" maxlength="32">
        <button onclick="executeOmega()" id="btnExecute">EXECUTE QUANTUM MATH</button>

        <div class="analyzer-screen" id="analyzerScreen">
            <div id="codeConsole" class="code-lines"></div>
        </div>

        <div class="final-box" id="resultBox">
            <div id="resTaiXiu" class="result-main"></div>
            <div id="resChanLe" class="result-sub"></div>
            
            <div class="stats">
                <span id="entropyStat">ENTROPY: 0.0000</span>
                <span id="chaosStat">LORENZ: (0, 0, 0)</span>
            </div>
        </div>
    </div>

    <script>
        // Web Crypto API để băm SHA-256 từ MD5 (Tăng cường độ phức tạp)
        async function sha256(message) {
            const msgBuffer = new TextEncoder().encode(message);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        function pushLog(text, isMath = false, isDanger = false) {
            const cons = document.getElementById('codeConsole');
            let className = "";
            if(isMath) className = "math-equation";
            if(isDanger) className = "danger-txt";
            
            cons.innerHTML += `<div class="${className}">[${(new Date()).toISOString().substring(11,23)}] ${text}</div>`;
            cons.scrollTop = cons.scrollHeight;
        }

        const sleep = ms => new Promise(r => setTimeout(r, ms));

        async function executeOmega() {
            const inputVal = document.getElementById('md5Input').value.trim().toLowerCase();
            if (!/^[a-f0-9]{32}$/.test(inputVal)) {
                alert("CRITICAL ERROR: Dữ liệu không phải mã MD5 32-bit.");
                return;
            }

            // Giao diện
            document.getElementById('btnExecute').style.display = 'none';
            document.getElementById('resultBox').style.display = 'none';
            document.getElementById('analyzerScreen').style.display = 'block';
            const cons = document.getElementById('codeConsole');
            cons.innerHTML = "";

            // BƯỚC 1: BĂM KÉP SHA-256
            pushLog("INITIATING QUANTUM HASHING...");
            await sleep(300);
            const shaHash = await sha256(inputVal);
            pushLog(`SHA-256 COLLISION: ${shaHash.substring(0, 32)}...`);
            
            // BƯỚC 2: TÍNH TOÁN LÝ THUYẾT HỖN LOẠN (LOGISTIC MAP)
            await sleep(400);
            pushLog("INJECTING CHAOS THEORY (LOGISTIC MAP)...", false, true);
            
            // Lấy 8 ký tự đầu để tạo hạt giống r (Tốc độ sinh sản trong hỗn loạn)
            let seedHex = shaHash.substring(0, 8);
            let seedInt = parseInt(seedHex, 16);
            
            // X_n+1 = r * X_n * (1 - X_n)
            let r = 3.6 + ((seedInt % 4000) / 10000); // Đảm bảo r nằm trong vùng hỗn loạn (3.6 -> 3.99)
            let x = 0.5; // Điểm bắt đầu
            
            pushLog(`ƒ(x) = ${r.toFixed(4)}x(1 - x)`, true);
            
            for(let i=1; i<=100; i++) {
                x = r * x * (1 - x);
                if (i % 25 === 0) pushLog(`Iteration ${i} -> x = ${x.toFixed(8)}`);
                await sleep(50);
            }

            // BƯỚC 3: HỆ TỌA ĐỘ LORENZ (LORENZ ATTRACTOR)
            pushLog("CALCULATING LORENZ ATTRACTOR COORDINATES...");
            await sleep(400);
            
            let y_val = (parseInt(shaHash.substring(8, 16), 16) / 4294967295) * 100;
            let z_val = (parseInt(shaHash.substring(16, 24), 16) / 4294967295) * 100;
            
            pushLog(`[dx/dt = σ(y - x)] | [dy/dt = x(ρ - z) - y] | [dz/dt = xy - βz]`, true);
            await sleep(500);

            // BƯỚC 4: KẾT XUẤT CUỐI CÙNG (COLLAPSE SUPERPOSITION)
            pushLog("COLLAPSING WAVE FUNCTION...", false, true);
            await sleep(600);

            // Xử lý X để ra Tài/Xỉu
            // Nhân x (từ 0 đến 1) với 1.000.000, lấy phần nguyên, xét chẵn lẻ
            let quantumCollapse = Math.floor(x * 1000000);
            
            // Xử lý Y, Z để ra Chẵn/Lẻ
            let spatialCollapse = Math.floor(y_val * z_val * 100);

            document.getElementById('analyzerScreen').style.display = 'none';
            document.getElementById('resultBox').style.display = 'block';
            
            // Rung màn hình
            document.getElementById('resultBox').classList.add('shake');
            setTimeout(() => document.getElementById('resultBox').classList.remove('shake'), 800);

            // Kết quả Tài Xỉu
            const txNode = document.getElementById('resTaiXiu');
            if (quantumCollapse % 2 === 0) {
                txNode.textContent = "TÀI";
                txNode.className = "result-main glitch-tai";
            } else {
                txNode.textContent = "XỈU";
                txNode.className = "result-main glitch-xiu";
            }

            // Kết quả Chẵn Lẻ
            const clNode = document.getElementById('resChanLe');
            if (spatialCollapse % 2 === 0) {
                clNode.textContent = "{ CHẴN }";
                clNode.className = "result-sub glitch-chan";
            } else {
                clNode.textContent = "{ LẺ }";
                clNode.className = "result-sub glitch-le";
            }

            // In thông số chuyên sâu
            document.getElementById('entropyStat').textContent = `ENTROPY: ${x.toFixed(6)}`;
            document.getElementById('chaosStat').textContent = `LORENZ: (${quantumCollapse.toString().substring(0,3)}, ${y_val.toFixed(1)}, ${z_val.toFixed(1)})`;

            document.getElementById('btnExecute').style.display = 'block';
            document.getElementById('btnExecute').textContent = "CALCULATE NEXT HASH";
        }
    </script>
</body>
</html>
