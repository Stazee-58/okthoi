<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MD5 DEEP NEURAL NETWORK v5.0</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background-color: #050505;
            color: #0ea5e9;
            font-family: 'Share Tech Mono', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
            background-image: 
                linear-gradient(rgba(14, 165, 233, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(14, 165, 233, 0.05) 1px, transparent 1px);
            background-size: 20px 20px;
        }

        .container {
            background: rgba(10, 10, 15, 0.9);
            padding: 30px;
            border-radius: 5px;
            box-shadow: 0 0 30px rgba(14, 165, 233, 0.2);
            width: 100%;
            max-width: 600px;
            border: 1px solid #0ea5e9;
            position: relative;
            overflow: hidden;
        }

        /* Scanline effect */
        .container::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        h1 {
            color: #38bdf8;
            font-size: 26px;
            text-align: center;
            text-shadow: 0 0 10px #38bdf8;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        input {
            width: 100%;
            padding: 15px;
            background-color: #000;
            border: 1px solid #38bdf8;
            color: #fff;
            font-size: 16px;
            font-family: 'Share Tech Mono', monospace;
            text-align: center;
            outline: none;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        
        input:focus { box-shadow: inset 0 0 15px rgba(56, 189, 248, 0.3); }

        button {
            width: 100%;
            padding: 15px;
            margin-top: 15px;
            background-color: #0284c7;
            color: #fff;
            border: none;
            font-size: 18px;
            font-family: 'Share Tech Mono', monospace;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        button:hover {
            background-color: #38bdf8;
            color: #000;
            box-shadow: 0 0 20px #38bdf8;
        }

        /* Hệ thống tiến trình đa luồng */
        .process-grid {
            display: none;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 25px;
        }

        .module {
            border: 1px solid #1e293b;
            padding: 10px;
            background: #000;
        }

        .module-title { font-size: 12px; color: #94a3b8; margin-bottom: 5px; }
        
        .progress-bar {
            width: 100%;
            height: 10px;
            background: #1e293b;
            position: relative;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: #38bdf8;
            box-shadow: 0 0 10px #38bdf8;
            transition: width 0.1s linear;
        }

        .module-status { font-size: 10px; color: #38bdf8; margin-top: 5px; text-align: right; }

        /* Khung kết quả cuối cùng */
        .final-result {
            display: none;
            margin-top: 20px;
            padding: 20px;
            border: 1px solid #38bdf8;
            text-align: center;
            background: rgba(0, 0, 0, 0.5);
        }

        .final-result h3 { font-size: 16px; color: #94a3b8; margin-bottom: 10px; }
        .final-result h2 { font-size: 60px; letter-spacing: 5px; margin: 10px 0; }
        
        .tai { color: #10b981; text-shadow: 0 0 20px #10b981; }
        .xiu { color: #f43f5e; text-shadow: 0 0 20px #f43f5e; }

        .confidence {
            font-size: 18px;
            color: #facc15;
            margin-top: 10px;
            text-shadow: 0 0 10px #facc15;
        }
        
        .disclaimer { font-size: 10px; color: #475569; text-align: center; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>[ DEEP NEURAL V5.0 ]</h1>
        <input type="text" id="md5Input" placeholder="ENTER 32-BIT MD5 HASH" maxlength="32">
        <button onclick="startDeepAnalysis()" id="btnStart">INITIATE ALGORITHM</button>

        <!-- Bảng đa luồng tiến trình -->
        <div class="process-grid" id="processGrid">
            <div class="module">
                <div class="module-title">1. Binary Matrix Extract</div>
                <div class="progress-bar"><div class="progress-fill" id="fill1"></div></div>
                <div class="module-status" id="stat1">0%</div>
            </div>
            <div class="module">
                <div class="module-title">2. K-Means Clustering</div>
                <div class="progress-bar"><div class="progress-fill" id="fill2"></div></div>
                <div class="module-status" id="stat2">0%</div>
            </div>
            <div class="module">
                <div class="module-title">3. Neural Pattern Match</div>
                <div class="progress-bar"><div class="progress-fill" id="fill3"></div></div>
                <div class="module-status" id="stat3">0%</div>
            </div>
            <div class="module">
                <div class="module-title">4. Probability Calc</div>
                <div class="progress-bar"><div class="progress-fill" id="fill4"></div></div>
                <div class="module-status" id="stat4">0%</div>
            </div>
        </div>

        <!-- Khung hiển thị kết quả -->
        <div class="final-result" id="resultBox">
            <h3>>>> AI PREDICTION <<<</h3>
            <h2 id="predictionText"></h2>
            <div class="confidence" id="confidenceText">Accuracy: 82.4%</div>
        </div>
        
        <p class="disclaimer">SYSTEM STATUS: ONLINE | ALGORITHM: DETERMINISTIC</p>
    </div>

    <script>
        function runProgress(fillId, statId, duration, delay) {
            return new Promise(resolve => {
                setTimeout(() => {
                    let fill = document.getElementById(fillId);
                    let stat = document.getElementById(statId);
                    let width = 0;
                    let interval = setInterval(() => {
                        width += Math.random() * 15;
                        if (width >= 100) {
                            width = 100;
                            fill.style.width = width + "%";
                            stat.textContent = "DONE";
                            clearInterval(interval);
                            resolve();
                        } else {
                            fill.style.width = width + "%";
                            stat.textContent = Math.floor(width) + "%";
                        }
                    }, duration / 10);
                }, delay);
            });
        }

        async function startDeepAnalysis() {
            const inputVal = document.getElementById('md5Input').value.trim().toLowerCase();
            const md5Regex = /^[a-f0-9]{32}$/;

            if (!md5Regex.test(inputVal)) {
                alert("LỖI: Mã MD5 phải bao gồm đúng 32 ký tự số và chữ (a-f)!");
                return;
            }

            // Reset UI
            document.getElementById('btnStart').style.display = 'none';
            document.getElementById('processGrid').style.display = 'grid';
            document.getElementById('resultBox').style.display = 'none';
            
            // Reset Progress bars
            for(let i=1; i<=4; i++) {
                document.getElementById(`fill${i}`).style.width = '0%';
                document.getElementById(`stat${i}`).textContent = '0%';
            }

            // Chạy đồng thời 4 tiến trình ảo với độ trễ khác nhau
            await Promise.all([
                runProgress('fill1', 'stat1', 800, 0),
                runProgress('fill2', 'stat2', 1200, 200),
                runProgress('fill3', 'stat3', 1500, 400),
                runProgress('fill4', 'stat4', 900, 600)
            ]);

            // ===== CÔNG THỨC TÍNH TOÁN SIÊU CẤP (DETERMINISTIC) =====
            // Bước 1: Chuyển 16 ký tự cuối thành một số BigInt giả lập
            let coreStr = inputVal.substring(16, 32);
            let complexNum = 0;
            
            // Tính toán ma trận trọng số dựa trên mã ASCII và Vị trí
            for (let i = 0; i < coreStr.length; i++) {
                complexNum += (coreStr.charCodeAt(i) * Math.pow(i + 1, 2));
            }
            
            // Trộn với 8 ký tự đầu để tạo Chaos
            let chaos = parseInt(inputVal.substring(0, 8), 16);
            let finalValue = (complexNum ^ chaos);

            // Xác định Tài/Xỉu
            const predictionNode = document.getElementById('predictionText');
            if (finalValue % 2 === 0) {
                predictionNode.textContent = "TÀI";
                predictionNode.className = "tai";
            } else {
                predictionNode.textContent = "XỈU";
                predictionNode.className = "xiu";
            }

            // Tạo Tỷ lệ chuẩn xác (luôn dao động từ 78.1% đến 84.9%)
            // Lấy 3 số cuối của finalValue để tạo tỷ lệ cố định cho mã này
            let rateSeed = finalValue % 1000; 
            let accuracy = 78.1 + (rateSeed / 1000) * 6.8; 
            document.getElementById('confidenceText').textContent = `AI Confidence: ${accuracy.toFixed(1)}%`;

            // Hiển thị kết quả
            document.getElementById('processGrid').style.display = 'none';
            document.getElementById('resultBox').style.display = 'block';
            document.getElementById('btnStart').style.display = 'block';
            document.getElementById('btnStart').textContent = "RE-ANALYZE NEW HASH";
        }
    </script>
</body>
</html>
