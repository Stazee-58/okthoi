<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V-OMEGA 3.0: QUANTUM SUPREMACY</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background-color: #030712;
            color: #00ffcc;
            font-family: 'JetBrains Mono', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
            background: radial-gradient(circle at center, #061022 0%, #000000 100%);
        }

        /* Lưới lượng tử & Phương trình chìm */
        .quantum-grid {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(0, 255, 204, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 204, 0.05) 1px, transparent 1px);
            background-size: 50px 50px;
            transform: perspective(800px) rotateX(70deg) translateY(-100px) translateZ(-200px);
            animation: warpDrive 20s linear infinite;
            z-index: 0;
        }

        .math-bg {
            position: absolute;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.03);
            white-space: pre-wrap;
            z-index: 1;
            pointer-events: none;
            text-align: center;
            width: 100%;
        }

        @keyframes warpDrive {
            0% { transform: perspective(800px) rotateX(70deg) translateY(0) translateZ(-200px); }
            100% { transform: perspective(800px) rotateX(70deg) translateY(50px) translateZ(-200px); }
        }

        .container {
            position: relative;
            z-index: 10;
            background: rgba(5, 10, 20, 0.85);
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 0 60px rgba(0, 255, 204, 0.1), inset 0 0 30px rgba(0, 255, 204, 0.1);
            width: 100%;
            max-width: 750px;
            border: 1px solid rgba(0, 255, 204, 0.3);
            backdrop-filter: blur(15px);
        }

        h1 {
            color: #fff;
            font-size: 36px;
            text-align: center;
            margin-bottom: 5px;
            letter-spacing: 6px;
            text-shadow: 0 0 10px #00ffcc, 0 0 30px #00b3ff;
            font-weight: 800;
        }

        .subtitle {
            text-align: center;
            font-size: 12px;
            color: #ff0055;
            margin-bottom: 35px;
            letter-spacing: 4px;
            font-weight: bold;
            animation: pulse-danger 1s infinite;
        }

        @keyframes pulse-danger { 0%, 100% { opacity: 1; text-shadow: 0 0 10px #ff0055; } 50% { opacity: 0.5; text-shadow: none;} }

        input {
            width: 100%;
            padding: 20px;
            background-color: rgba(0, 0, 0, 0.8);
            border: 1px solid #00ffcc;
            color: #fff;
            font-size: 20px;
            font-family: 'JetBrains Mono', monospace;
            text-align: center;
            outline: none;
            text-transform: uppercase;
            letter-spacing: 4px;
            border-radius: 4px;
            transition: all 0.3s;
        }
        
        input:focus {
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.6);
            border-color: #00b3ff;
        }

        button {
            width: 100%;
            padding: 18px;
            margin-top: 25px;
            background: linear-gradient(135deg, #00ffcc, #0055ff);
            color: #fff;
            border: none;
            font-size: 22px;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 800;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 5px;
            border-radius: 4px;
            box-shadow: 0 0 20px rgba(0, 179, 255, 0.4);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 40px rgba(0, 255, 204, 0.8);
        }

        /* Terminal Console */
        .analyzer-screen {
            display: none;
            margin-top: 30px;
            background: #010409;
            border: 1px solid #1f3a52;
            padding: 20px;
            height: 300px;
            overflow-y: hidden;
            position: relative;
            border-radius: 4px;
            box-shadow: inset 0 0 20px rgba(0,0,0,1);
        }

        .code-lines {
            font-size: 13px;
            color: #00ffcc;
            line-height: 1.6;
        }

        .log-math { color: #ffeb3b; }
        .log-sys { color: #00b3ff; }
        .log-err { color: #ff0055; font-weight: bold; }
        .log-qnt { color: #b388ff; font-style: italic; }

        /* Khối hiển thị kết quả */
        .final-box {
            display: none;
            margin-top: 30px;
            text-align: center;
            padding: 35px 15px;
            background: rgba(0,0,0,0.9);
            border-top: 3px solid #00ffcc;
            border-bottom: 3px solid #ff0055;
            position: relative;
        }

        .result-main {
            font-size: 85px;
            font-weight: 800;
            letter-spacing: 15px;
            margin-bottom: 5px;
        }

        .result-sub {
            font-size: 35px;
            letter-spacing: 8px;
            font-weight: 700;
        }

        .glitch-tai { color: #00ffcc; text-shadow: 4px 4px 0px #0055ff, -4px -4px 0px #ffeb3b; }
        .glitch-xiu { color: #ff0055; text-shadow: 4px 4px 0px #ffeb3b, -4px -4px 0px #00b3ff; }
        .glitch-chan { color: #ffeb3b; text-shadow: 2px 2px 0px #000; }
        .glitch-le { color: #b388ff; text-shadow: 2px 2px 0px #000; }

        .scanline {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 5px;
            background: rgba(0, 255, 204, 0.5);
            opacity: 0.6;
            animation: scan 2s linear infinite;
        }

        @keyframes scan {
            0% { top: 0; }
            100% { top: 100%; }
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            font-size: 12px;
            color: #888;
            margin-top: 25px;
            font-weight: bold;
            text-align: left;
            border-top: 1px dashed #333;
            padding-top: 15px;
        }
        .stats span { color: #00ffcc; float: right; }
    </style>
</head>
<body>
    <div class="quantum-grid"></div>
    <div class="math-bg">
        ∂Ψ/∂t = iℏ∇²Ψ - V(x)Ψ<br><br>
        e^(iπ) + 1 = 0<br><br>
        ∇ × B = μ₀J + μ₀ε₀(∂E/∂t)<br><br>
        Z_{n+1} = sin(Z_n²) + C
    </div>

    <div class="container">
        <h1>V-OMEGA 3.0</h1>
        <div class="subtitle">SCHRÖDINGER WAVE COLLAPSE ALGORITHM</div>
        
        <input type="text" id="md5Input" placeholder="INPUT 32-BIT HASH SEQUENCE" maxlength="32">
        <button onclick="executeQuantum()" id="btnExecute">INITIALIZE TENSOR MATRIX</button>

        <div class="analyzer-screen" id="analyzerScreen">
            <div id="codeConsole" class="code-lines"></div>
        </div>

        <div class="final-box" id="resultBox">
            <div class="scanline"></div>
            <div id="resTaiXiu" class="result-main"></div>
            <div id="resChanLe" class="result-sub"></div>
            
            <div class="stats">
                <div>PHASE ANGLE (θ): <span id="statTheta">0.000 rad</span></div>
                <div>EIGENVALUE (λ): <span id="statLambda">0.000</span></div>
                <div>TENSOR DET |ρ|: <span id="statDet">0.000</span></div>
                <div>DECOHERENCE T: <span id="statTime">0.00 ms</span></div>
            </div>
        </div>
    </div>

    <script>
        // LỚP TOÁN HỌC SỐ PHỨC (COMPLEX NUMBERS)
        class Complex {
            constructor(r, i) { this.r = r; this.i = i; }
            add(c) { return new Complex(this.r + c.r, this.i + c.i); }
            mul(c) { return new Complex(this.r * c.r - this.i * c.i, this.r * c.i + this.i * c.r); }
            // Hàm Complex Sine: sin(x+iy) = sin(x)cosh(y) + i*cos(x)sinh(y)
            sin() {
                return new Complex(
                    Math.sin(this.r) * Math.cosh(this.i),
                    Math.cos(this.r) * Math.sinh(this.i)
                );
            }
            mag() { return Math.sqrt(this.r * this.r + this.i * this.i); }
            angle() { return Math.atan2(this.i, this.r); } // Trả về [-π, π]
        }

        async function sha512(message) {
            const msgBuffer = new TextEncoder().encode(message);
            const hashBuffer = await crypto.subtle.digest('SHA-512', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        function pushLog(text, type = "sys") {
            const cons = document.getElementById('codeConsole');
            let className = `log-${type}`;
            cons.innerHTML += `<div class="${className}">[${(new Date()).toISOString().substring(11,23)}] ${text}</div>`;
            cons.scrollTop = cons.scrollHeight;
        }

        const sleep = ms => new Promise(r => setTimeout(r, ms));

        async function executeQuantum() {
            const inputVal = document.getElementById('md5Input').value.trim().toLowerCase();
            if (!/^[a-f0-9]{32}$/.test(inputVal)) {
                alert("CRITICAL ERROR: HỆ THỐNG YÊU CẦU CHUỖI MD5 32 KÝ TỰ.");
                return;
            }

            const startTime = performance.now();

            // Reset UI
            document.getElementById('btnExecute').style.display = 'none';
            document.getElementById('resultBox').style.display = 'none';
            document.getElementById('analyzerScreen').style.display = 'block';
            document.getElementById('codeConsole').innerHTML = "";

            // BƯỚC 1: HÀM TRỄ VDF (MÔ PHỎNG ĐA CHIỀU)
            pushLog("ENGAGING VERIFIABLE DELAY FUNCTION (VDF)...", "sys");
            let hash = inputVal;
            for(let i = 0; i < 5; i++) {
                hash = await sha512(hash);
                if(i===0) pushLog(`SHA-512 EXPANSION: ${hash.substring(0, 40)}...`, "sys");
            }
            await sleep(300);

            // BƯỚC 2: TÍNH TOÁN MA TRẬN TENSOR 4x4
            pushLog("CONSTRUCTING 4x4 DENSITY MATRIX ρ...", "qnt");
            let m = [];
            for(let i=0; i<16; i++) {
                m.push(parseInt(hash.substring(i*4, i*4+4), 16) / 65535);
            }
            // Định thức xấp xỉ ma trận 4x4 từ đường chéo và các vết (Trace)
            let tensorDet = (m[0]*m[5]*m[10]*m[15]) - (m[3]*m[6]*m[9]*m[12]);
            pushLog(`TENSOR DET |ρ| = ${tensorDet.toFixed(8)}`, "math");
            await sleep(400);

            // BƯỚC 3: TIẾN HÓA SÓNG TRONG KHÔNG GIAN PHỨC (FRACTAL SINE)
            pushLog("APPLYING HAMILTONIAN OPERATOR ĤΨ = EΨ...", "err");
            
            // Lấy hạt giống từ 64 ký tự cuối của chuỗi SHA-512
            let realSeed = parseInt(hash.substring(64, 80), 16) / 1e19;
            let imagSeed = parseInt(hash.substring(80, 96), 16) / 1e19;

            // Chuyển đổi thành số phức C trong giới hạn an toàn [-2, 2]
            let c_real = -2.0 + (realSeed * 4.0);
            let c_imag = -2.0 + (imagSeed * 4.0);
            let C = new Complex(c_real, c_imag);
            let Z = new Complex(0, 0);

            pushLog(`ƒ(Z_{n+1}) = sin(Z_n²) + (${c_real.toFixed(4)} + ${c_imag.toFixed(4)}i)`, "math");
            await sleep(500);

            // Chạy 100 vòng lặp lượng tử
            for(let i = 1; i <= 100; i++) {
                let Z_squared = Z.mul(Z); // Z^2
                let Z_sin = Z_squared.sin(); // sin(Z^2)
                Z = Z_sin.add(C); // sin(Z^2) + C
                
                if (i % 25 === 0) {
                    pushLog(`Wavepacket ${i}: Ψ = [${Z.r.toFixed(4)} + ${Z.i.toFixed(4)}i]`, "qnt");
                    await sleep(100);
                }
            }

            // BƯỚC 4: SỤP ĐỔ HÀM SÓNG (MEASUREMENT)
            pushLog("MEASURING HILBERT SPACE OBSERVABLES...", "sys");
            await sleep(400);
            pushLog("COLLAPSING SUPERPOSITION...", "err");
            await sleep(600);

            // Lấy Góc Pha (Phase Angle) để định đoạt Tài Xỉu
            let theta = Z.angle(); // Từ -π đến π

            // Lấy Trị Riêng (Eigenvalue) để định đoạt Chẵn Lẻ
            let lambda = Z.mag();
            let parityCheck = Math.floor(lambda * 1000000); 

            // HIỂN THỊ UI
            document.getElementById('analyzerScreen').style.display = 'none';
            document.getElementById('resultBox').style.display = 'block';

            // TÀI / XỈU (Dựa vào pha không gian: Pha Dương = Tài, Pha Âm = Xỉu)
            const txNode = document.getElementById('resTaiXiu');
            if (theta > 0) {
                txNode.textContent = "TÀI";
                txNode.className = "result-main glitch-tai";
            } else {
                txNode.textContent = "XỈU";
                txNode.className = "result-main glitch-xiu";
            }

            // CHẴN / LẺ (Dựa vào Modulo của Trị riêng)
            const clNode = document.getElementById('resChanLe');
            if (parityCheck % 2 === 0) {
                clNode.textContent = "{ CHẴN }";
                clNode.className = "result-sub glitch-chan";
            } else {
                clNode.textContent = "{ LẺ }";
                clNode.className = "result-sub glitch-le";
            }

            const endTime = performance.now();

            // Cập nhật chỉ số Stats
            document.getElementById('statTheta').textContent = `${theta.toFixed(6)} rad`;
            document.getElementById('statLambda').textContent = `${lambda.toFixed(6)}`;
            document.getElementById('statDet').textContent = `${tensorDet.toExponential(4)}`;
            document.getElementById('statTime').textContent = `${(endTime - startTime).toFixed(2)} ms`;

            // Trả lại nút bấm
            document.getElementById('btnExecute').style.display = 'block';
            document.getElementById('btnExecute').textContent = "CALCULATE NEXT TENSOR";
        }
    </script>
</body>
</html>
