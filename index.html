<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS AI - Smart Predictor</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800;900&display=swap');

        :root {
            /* Bảng màu Lofi Dark (Catppuccin Mocha style) */
            --bg-color: #11111b;
            --card-bg: #1e1e2e;
            --surface-bg: #313244;
            --text-main: #cdd6f4;
            --text-muted: #a6adc8;
            --accent-blue: #89b4fa;
            --accent-pink: #f5c2e7;
            --accent-green: #a6e3a1;
            --accent-red: #f38ba8;
            --border-color: #45475a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Nunito', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Khung chính cân đối tuyệt đối */
        .container {
            background: var(--card-bg);
            padding: 40px;
            width: 100%;
            max-width: 550px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            text-align: center;
            border: 1px solid var(--border-color);
        }

        h1 {
            color: var(--accent-blue);
            font-size: 32px;
            margin-bottom: 5px;
            font-weight: 900;
            letter-spacing: 2px;
        }

        .subtitle {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 35px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Ô nhập liệu */
        .input-wrapper {
            background: var(--bg-color);
            border: 2px solid var(--border-color);
            border-radius: 16px;
            padding: 5px 20px;
            margin-bottom: 25px;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .input-wrapper:focus-within {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 4px rgba(137, 180, 250, 0.1);
        }
        
        input {
            width: 100%;
            background: transparent;
            border: none;
            padding: 16px 0;
            color: var(--text-main);
            font-size: 16px;
            font-family: 'Nunito', sans-serif;
            font-weight: 600;
            text-align: center;
            outline: none;
            letter-spacing: 1px;
        }

        input::placeholder {
            color: #585b70;
        }

        button {
            width: 100%;
            padding: 16px;
            background: var(--accent-blue);
            color: var(--bg-color);
            border: none;
            border-radius: 16px;
            font-size: 16px;
            font-family: 'Nunito', sans-serif;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 1px;
        }

        button:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        /* Màn hình log gọn gàng */
        .analyzer-screen {
            display: none;
            margin-top: 25px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            height: 180px;
            overflow-y: auto;
            text-align: left;
        }

        .code-lines {
            font-size: 14px;
            line-height: 1.8;
            font-family: monospace;
            color: var(--text-muted);
        }
        
        .log-sys { color: var(--accent-blue); }
        .log-warn { color: var(--accent-pink); }
        .log-succ { color: var(--accent-green); }

        /* Vùng kết quả */
        .result-container {
            display: none;
            margin-top: 25px;
            padding: 30px 20px;
            background: var(--surface-bg);
            border-radius: 16px;
            border: 1px solid var(--border-color);
        }

        .result-title {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 10px;
            font-weight: 800;
            letter-spacing: 2px;
        }

        .result-value {
            font-size: 50px;
            font-weight: 900;
            letter-spacing: 4px;
            margin-bottom: 20px;
        }
        
        .val-tai { color: var(--accent-blue); }
        .val-xiu { color: var(--accent-pink); }

        .stats {
            display: flex;
            justify-content: center;
            gap: 15px;
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 600;
        }
        .stats span { color: var(--text-main); background: var(--bg-color); padding: 6px 12px; border-radius: 8px;}

        /* Nút Feedback đối xứng tuyệt đối */
        .feedback-section {
            display: none;
            margin-top: 25px;
            padding-top: 25px;
            border-top: 1px dashed var(--border-color);
        }

        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr; /* Chia đôi tuyệt đối */
            gap: 15px;
        }
        
        .btn-group button {
            padding: 14px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-correct {
            background: rgba(166, 227, 161, 0.1);
            color: var(--accent-green);
            border: 1px solid var(--accent-green);
        }
        .btn-correct:hover { background: var(--accent-green); color: var(--bg-color); transform: translateY(-2px); }
        
        .btn-incorrect {
            background: rgba(243, 139, 168, 0.1);
            color: var(--accent-red);
            border: 1px solid var(--accent-red);
        }
        .btn-incorrect:hover { background: var(--accent-red); color: var(--bg-color); transform: translateY(-2px); }

        /* Tùy chỉnh thanh cuộn */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 10px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>NEXUS AI</h1>
        <div class="subtitle">MÔ HÌNH MÁY HỌC CỤC BỘ</div>
        
        <div class="input-wrapper">
            <input type="text" id="md5Input" placeholder="Nhập mã MD5 (32 ký tự)" maxlength="32">
        </div>
        
        <button onclick="executeLogic()" id="btnExecute">PHÂN TÍCH DỮ LIỆU</button>

        <div class="analyzer-screen" id="analyzerScreen">
            <div id="codeConsole" class="code-lines"></div>
        </div>

        <div id="finalOutput" class="result-container">
            <div class="result-title">KẾT QUẢ DỰ ĐOÁN</div>
            <div id="resTaiXiu" class="result-value"></div>
            
            <div class="stats">
                <div>Dữ liệu: <span id="statMatch">Mới</span></div>
                <div>Trọng số: <span id="statWeight">0</span></div>
            </div>

            <!-- Khu vực Dạy AI cân xứng -->
            <div class="feedback-section" id="feedbackSection">
                <div class="result-title" style="margin-bottom: 15px;">XÁC NHẬN ĐỂ HUẤN LUYỆN AI</div>
                <div class="btn-group">
                    <button onclick="sendFeedback(true)" class="btn-correct">✓ CHÍNH XÁC</button>
                    <button onclick="sendFeedback(false)" class="btn-incorrect">✗ ĐẢO NGƯỢC</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let aiMemory = JSON.parse(localStorage.getItem('nexus_ai_v2')) || {};
        let currentMd5 = "";
        let currentPrediction = "";

        function pushLog(text, type = "sys") {
            const cons = document.getElementById('codeConsole');
            cons.innerHTML += `<div class="log-${type}">> ${text}</div>`;
            cons.scrollTop = cons.scrollHeight;
        }

        const sleep = ms => new Promise(r => setTimeout(r, ms));

        async function executeLogic() {
            const inputVal = document.getElementById('md5Input').value.trim().toLowerCase();
            if (inputVal.length !== 32) {
                alert("Định dạng không hợp lệ. Yêu cầu chuỗi MD5 đúng 32 ký tự.");
                return;
            }

            currentMd5 = inputVal;

            document.getElementById('btnExecute').style.display = 'none';
            document.getElementById('finalOutput').style.display = 'none';
            document.getElementById('feedbackSection').style.display = 'none';
            document.getElementById('analyzerScreen').style.display = 'block';
            document.getElementById('codeConsole').innerHTML = "";

            pushLog("Khởi tạo tiến trình phân tích...", "sys");
            await sleep(400);

            let isMatched = false;
            let hexWeightSum = 0;

            if (aiMemory[currentMd5]) {
                pushLog(`Phát hiện mã MD5 trùng khớp trong Local Storage.`, "succ");
                await sleep(500);
                pushLog(`Đang trích xuất dữ liệu đã huấn luyện...`, "sys");
                
                currentPrediction = aiMemory[currentMd5];
                isMatched = true;
                hexWeightSum = "Lưu trữ nội bộ";
            } else {
                pushLog("Mã MD5 mới. Bắt đầu thuật toán tính trọng số...", "sys");
                await sleep(400);
                
                for(let i = 0; i < currentMd5.length; i++) {
                    let val = parseInt(currentMd5[i], 16);
                    hexWeightSum += val;
                }

                pushLog(`Tổng trọng số Hex: ${hexWeightSum}`, "warn");
                await sleep(400);
                
                if (hexWeightSum % 2 !== 0) {
                    currentPrediction = "TÀI";
                } else {
                    currentPrediction = "XỈU";
                }
                pushLog(`Hoàn tất dự đoán.`, "succ");
            }

            await sleep(500);
            
            document.getElementById('analyzerScreen').style.display = 'none';
            document.getElementById('finalOutput').style.display = 'block';
            
            updateResultUI(currentPrediction);
            
            document.getElementById('statMatch').textContent = isMatched ? "Đã huấn luyện" : "Tính toán mới";
            document.getElementById('statWeight').textContent = hexWeightSum;
            document.getElementById('feedbackSection').style.display = 'block';
        }

        function updateResultUI(result) {
            const txNode = document.getElementById('resTaiXiu');
            txNode.textContent = result;
            txNode.className = result === "TÀI" ? "result-value val-tai" : "result-value val-xiu";
        }

        function sendFeedback(isCorrect) {
            let finalLearnedResult = currentPrediction;

            if (!isCorrect) {
                finalLearnedResult = currentPrediction === "TÀI" ? "XỈU" : "TÀI";
                updateResultUI(finalLearnedResult);
                
                document.getElementById('analyzerScreen').style.display = 'block';
                pushLog(`Xác nhận sai. Đã đảo ngược kết quả thành: ${finalLearnedResult}`, "warn");
            } else {
                document.getElementById('analyzerScreen').style.display = 'block';
                pushLog(`Dự đoán chính xác. Tiến hành ghi nhớ...`, "succ");
            }

            aiMemory[currentMd5] = finalLearnedResult;
            localStorage.setItem('nexus_ai_v2', JSON.stringify(aiMemory));
            
            pushLog("Đã cập nhật cơ sở dữ liệu. Sẵn sàng cho truy vấn mới.", "sys");

            document.getElementById('feedbackSection').style.display = 'none';
            document.getElementById('btnExecute').style.display = 'block';
            document.getElementById('btnExecute').textContent = "PHÂN TÍCH MÃ TIẾP THEO";
            document.getElementById('md5Input').value = "";
        }
    </script>
</body>
</html>
