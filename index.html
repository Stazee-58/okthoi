<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Predictor - Cute Edition 🌸</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700;900&display=swap');

        :root {
            --bg-gradient: linear-gradient(135deg, #ffd1ff 0%, #fae1dd 100%);
            --card-bg: rgba(255, 255, 255, 0.95);
            --primary-pink: #ffb6c1;
            --primary-blue: #a3c4f3;
            --text-dark: #5c4d5d;
            --text-light: #8e7f8f;
            --shadow: 0 15px 35px rgba(255, 182, 193, 0.3);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background: var(--bg-gradient);
            color: var(--text-dark);
            font-family: 'Quicksand', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Khung chính cân đối tuyệt đối */
        .container {
            background: var(--card-bg);
            padding: 40px;
            width: 100%;
            max-width: 550px;
            border-radius: 30px;
            box-shadow: var(--shadow);
            text-align: center;
            border: 3px solid #fff;
            position: relative;
        }

        /* Trang trí tai thỏ/nơ (tùy chọn) */
        .decoration {
            font-size: 40px;
            margin-bottom: -15px;
            position: relative;
            z-index: 2;
        }

        h1 {
            color: #ff9eaa;
            font-size: 32px;
            margin-bottom: 5px;
            font-weight: 900;
            letter-spacing: 2px;
        }

        .subtitle {
            font-size: 14px;
            color: var(--text-light);
            margin-bottom: 30px;
            font-weight: 700;
        }

        /* Ô nhập liệu bo tròn, text ở giữa */
        .input-wrapper {
            background: #fff;
            border: 2px solid #ffe1e6;
            border-radius: 50px;
            padding: 5px 20px;
            margin-bottom: 25px;
            transition: all 0.3s;
            box-shadow: inset 0 3px 10px rgba(0,0,0,0.02);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .input-wrapper:focus-within {
            border-color: var(--primary-pink);
            box-shadow: 0 0 15px rgba(255, 182, 193, 0.4);
        }
        
        input {
            width: 100%;
            background: transparent;
            border: none;
            padding: 15px 0;
            color: var(--text-dark);
            font-size: 16px;
            font-family: 'Quicksand', sans-serif;
            font-weight: 700;
            text-align: center;
            outline: none;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input::placeholder {
            color: #d1c8d1;
            text-transform: none;
        }

        button {
            width: 100%;
            padding: 18px;
            background: var(--primary-pink);
            color: #fff;
            border: none;
            border-radius: 50px;
            font-size: 18px;
            font-family: 'Quicksand', sans-serif;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(255, 182, 193, 0.5);
            letter-spacing: 1px;
        }

        button:hover {
            transform: translateY(-3px);
            background: #ff9eaa;
            box-shadow: 0 8px 20px rgba(255, 182, 193, 0.6);
        }

        /* Màn hình log siêu cute */
        .analyzer-screen {
            display: none;
            margin-top: 25px;
            background: #fffafa;
            border: 2px dashed #ffc0cb;
            border-radius: 20px;
            padding: 20px;
            height: 200px;
            overflow-y: auto;
            text-align: center; /* Cân giữa text log */
        }

        .code-lines {
            font-size: 14px;
            line-height: 1.8;
            font-weight: 700;
        }
        
        .log-sys { color: #a3c4f3; }
        .log-warn { color: #fbc4ab; }
        .log-err { color: #ffb5a7; }
        .log-succ { color: #b5e48c; }

        /* Vùng kết quả */
        .result-container {
            display: none;
            margin-top: 25px;
            padding: 30px 20px;
            background: #fff;
            border: 2px solid #ffe1e6;
            border-radius: 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.03);
        }

        .result-title {
            font-size: 14px;
            color: var(--text-light);
            margin-bottom: 10px;
            font-weight: 700;
        }

        .result-value {
            font-size: 60px;
            font-weight: 900;
            letter-spacing: 4px;
            margin-bottom: 15px;
        }
        
        .val-tai { color: var(--primary-blue); text-shadow: 2px 2px 0px #e1eeff; }
        .val-xiu { color: var(--primary-pink); text-shadow: 2px 2px 0px #ffe1e6; }

        .stats {
            display: flex;
            justify-content: center;
            gap: 20px;
            font-size: 13px;
            color: var(--text-light);
            font-weight: 700;
        }
        .stats span { color: var(--text-dark); background: #f8f9fa; padding: 4px 10px; border-radius: 12px;}

        /* Nút Feedback đối xứng tuyệt đối */
        .feedback-section {
            display: none;
            margin-top: 25px;
            padding-top: 25px;
            border-top: 2px dashed #ffe1e6;
        }

        .feedback-title {
            font-size: 14px;
            color: var(--text-light);
            margin-bottom: 15px;
            font-weight: 700;
        }

        .btn-group {
            display: flex;
            gap: 15px;
        }
        
        .btn-group button {
            flex: 1; /* Chia đều 50% mỗi nút */
            padding: 15px;
            border-radius: 25px;
            font-size: 15px;
            box-shadow: none;
        }

        .btn-correct {
            background: #e8f5e9;
            color: #4caf50;
        }
        .btn-correct:hover { background: #4caf50; color: #fff; transform: translateY(-2px); }
        
        .btn-incorrect {
            background: #ffebee;
            color: #f44336;
        }
        .btn-incorrect:hover { background: #f44336; color: #fff; transform: translateY(-2px); }

    </style>
</head>
<body>

    <div class="container">
        <div class="decoration">✨🎀✨</div>
        <h1>Bé AI Học Việc</h1>
        <div class="subtitle">MÔ HÌNH HỌC TẬP QUA TỪNG VÁN</div>
        
        <div class="input-wrapper">
            <input type="text" id="md5Input" placeholder="Nhập mã MD5 vào đây nha..." maxlength="32">
        </div>
        
        <button onclick="executeLogic()" id="btnExecute">✨ PHÂN TÍCH MÃ NÀY ✨</button>

        <div class="analyzer-screen" id="analyzerScreen">
            <div id="codeConsole" class="code-lines"></div>
        </div>

        <div id="finalOutput" class="result-container">
            <div class="result-title">BÉ ĐOÁN LÀ:</div>
            <div id="resTaiXiu" class="result-value"></div>
            
            <div class="stats">
                <div>Nguồn: <span id="statMatch">Mới Tinh</span></div>
                <div>Hex-Weight: <span id="statWeight">0</span></div>
            </div>

            <!-- Khu vực Dạy AI cân xứng -->
            <div class="feedback-section" id="feedbackSection">
                <div class="feedback-title">BÉ ĐOÁN CÓ ĐÚNG KHÔNG Ạ?</div>
                <div class="btn-group">
                    <button onclick="sendFeedback(true)" class="btn-correct">💖 DẠ ĐÚNG</button>
                    <button onclick="sendFeedback(false)" class="btn-incorrect">💔 SAI (ĐẢO LẠI)</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Khởi tạo/Lấy dữ liệu LocalStorage (Bộ nhớ AI)
        let aiMemory = JSON.parse(localStorage.getItem('cute_ai_dataset')) || {};
        let currentMd5 = "";
        let currentPrediction = "";

        function pushLog(text, type = "sys") {
            const cons = document.getElementById('codeConsole');
            cons.innerHTML += `<div class="log-${type}">${text}</div>`;
            cons.scrollTop = cons.scrollHeight;
        }

        const sleep = ms => new Promise(r => setTimeout(r, ms));

        async function executeLogic() {
            const inputVal = document.getElementById('md5Input').value.trim().toLowerCase();
            if (inputVal.length !== 32) {
                alert("⚠️ Ui da! Mã MD5 phải có đủ 32 ký tự bạn nha!");
                return;
            }

            currentMd5 = inputVal;

            document.getElementById('btnExecute').style.display = 'none';
            document.getElementById('finalOutput').style.display = 'none';
            document.getElementById('feedbackSection').style.display = 'none';
            document.getElementById('analyzerScreen').style.display = 'block';
            document.getElementById('codeConsole').innerHTML = "";

            pushLog("🌸 Đang mở cuốn sổ phép thuật...", "sys");
            await sleep(500);

            let isMatched = false;
            let hexWeightSum = 0;

            // KIỂM TRA BỘ NHỚ
            if (aiMemory[currentMd5]) {
                pushLog(`✨ Ôi chao! Bé nhớ ra mã này rồi nè!`, "succ");
                await sleep(600);
                pushLog(`Lật tìm kết quả trong trí nhớ...`, "sys");
                
                currentPrediction = aiMemory[currentMd5];
                isMatched = true;
                hexWeightSum = "Lưu trong trí nhớ";
            } else {
                pushLog("🔍 Hmmm mã này mới quá, để bé nhẩm tính chút nha...", "sys");
                await sleep(500);
                
                for(let i = 0; i < currentMd5.length; i++) {
                    let val = parseInt(currentMd5[i], 16);
                    hexWeightSum += val;
                }

                pushLog(`Trọng lượng mã là: ${hexWeightSum}`, "warn");
                await sleep(500);
                
                if (hexWeightSum % 2 !== 0) {
                    currentPrediction = "TÀI";
                } else {
                    currentPrediction = "XỈU";
                }
                pushLog(`Tính xong rồi! Chốt nha!`, "succ");
            }

            await sleep(600);
            
            // Render kết quả
            document.getElementById('analyzerScreen').style.display = 'none';
            document.getElementById('finalOutput').style.display = 'block';
            
            updateResultUI(currentPrediction);
            
            document.getElementById('statMatch').textContent = isMatched ? "Trí Nhớ Cũ" : "Vừa Tính Xong";
            document.getElementById('statWeight').textContent = hexWeightSum;

            // Hiện nút feedback để Train AI
            document.getElementById('feedbackSection').style.display = 'block';
        }

        function updateResultUI(result) {
            const txNode = document.getElementById('resTaiXiu');
            txNode.textContent = result;
            txNode.className = result === "TÀI" ? "result-value val-tai" : "result-value val-xiu";
        }

        // CƠ CHẾ TRAIN AI VÀ GHI LOG (LOCAL STORAGE)
        function sendFeedback(isCorrect) {
            let finalLearnedResult = currentPrediction;

            if (!isCorrect) {
                // Đảo ngược kết quả nếu đoán sai
                finalLearnedResult = currentPrediction === "TÀI" ? "XỈU" : "TÀI";
                updateResultUI(finalLearnedResult);
                
                document.getElementById('analyzerScreen').style.display = 'block';
                pushLog(`💦 Bé xin lỗi! Đã đổi kết quả thành: ${finalLearnedResult}`, "err");
            } else {
                document.getElementById('analyzerScreen').style.display = 'block';
                pushLog(`💖 Yeyyy! Bé đoán trúng rồi!`, "succ");
            }

            // LƯU VÀO TRÌNH DUYỆT
            aiMemory[currentMd5] = finalLearnedResult;
            localStorage.setItem('cute_ai_dataset', JSON.stringify(aiMemory));
            
            pushLog("Đã chép cẩn thận vào sổ tay! Sẵn sàng cho ván mới 🌸", "sys");

            // Đổi UI sang trạng thái chờ nhập mã mới
            document.getElementById('feedbackSection').style.display = 'none';
            document.getElementById('btnExecute').style.display = 'block';
            document.getElementById('btnExecute').textContent = "✨ PHÂN TÍCH TIẾP NHA ✨";
            document.getElementById('md5Input').value = ""; // Xóa ô nhập liệu
        }
    </script>
</body>
</html>
