<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MD5 QUANTUM PREDICTOR</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: #030712;
            color: #10b981;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: #020617;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(16, 185, 129, 0.15);
            width: 100%;
            max-width: 550px;
            border: 1px solid #1e293b;
        }

        h1 {
            color: #10b981;
            margin-bottom: 5px;
            font-size: 24px;
            text-align: center;
            letter-spacing: 3px;
            text-shadow: 0 0 10px rgba(16, 185, 129, 0.5);
        }

        p.desc {
            color: #64748b;
            font-size: 13px;
            text-align: center;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 18px;
            border: 1px solid #334155;
            background-color: #0f172a;
            color: #38bdf8;
            font-size: 18px;
            outline: none;
            text-align: center;
            letter-spacing: 2px;
            border-radius: 6px;
            font-weight: bold;
        }

        input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
        }

        button {
            width: 100%;
            padding: 16px;
            margin-top: 20px;
            background-color: #0f766e;
            color: #ffffff;
            border: none;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-radius: 6px;
        }

        button:hover {
            background-color: #14b8a6;
            box-shadow: 0 0 20px rgba(20, 184, 166, 0.4);
        }

        /* Terminal siêu tốc */
        .terminal {
            display: none;
            margin-top: 25px;
            background-color: #000000;
            border: 1px solid #1e293b;
            padding: 15px;
            height: 180px;
            border-radius: 6px;
            overflow-y: hidden;
            font-size: 13px;
            color: #10b981;
            text-align: left;
            line-height: 1.6;
        }

        .terminal p { margin: 4px 0; }
        .highlight { color: #facc15; }
        
        .result-box {
            display: none;
            margin-top: 25px;
            padding: 25px;
            background-color: #020617;
            border-radius: 8px;
            text-align: center;
        }

        .result-box h2 {
            font-size: 55px;
            letter-spacing: 8px;
            margin-top: 15px;
            margin-bottom: 10px;
        }

        .tai { color: #22c55e; text-shadow: 0 0 20px rgba(34, 197, 94, 0.6); border: 2px solid #22c55e;}
        .xiu { color: #ef4444; text-shadow: 0 0 20px rgba(239, 68, 68, 0.6); border: 2px solid #ef4444;}
        
        /* Stats Box hiện thông số */
        .stats {
            display: flex;
            justify-content: space-between;
            color: #94a3b8;
            font-size: 12px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px dashed #334155;
        }

        .error {
            color: #ef4444;
            margin-top: 15px;
            font-size: 14px;
            display: none;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>[ QUANTUM MD5 CORE ]</h1>
        <p class="desc">v4.0 - Perfect 50/50 Distribution Algorithm</p>

        <input type="text" id="md5Input" placeholder="DÁN MÃ MD5 VÀO ĐÂY" autocomplete="off" spellcheck="false">
        
        <button onclick="startAnalysis()">KÍCH HOẠT QUÉT</button>
        
        <div id="errorMsg" class="error">❌ Định dạng sai! Yêu cầu chuẩn 32 ký tự Hex.</div>

        <div id="terminal" class="terminal">
            <div id="logContent"></div>
            <span>_</span>
        </div>

        <div id="resultBox" class="result-box">
            <div style="color: #64748b; font-size: 14px; letter-spacing: 2px;">KẾT QUẢ ĐÃ GIẢI MÃ</div>
            <h2 id="predictionText"></h2>
            
            <div class="stats">
                <span id="statHash">Hash Lõi: ---</span>
                <span id="statParity">Biến thiên: ---</span>
            </div>
        </div>
    </div>

    <script>
        function printLog(text, delay, callback) {
            setTimeout(() => {
                const logContent = document.getElementById('logContent');
                logContent.innerHTML += `<p>> ${text}</p>`;
                if (callback) callback();
            }, delay);
        }

        function startAnalysis() {
            const inputVal = document.getElementById('md5Input').value.trim().toLowerCase();
            const errorMsg = document.getElementById('errorMsg');
            const terminal = document.getElementById('terminal');
            const logContent = document.getElementById('logContent');
            const resultBox = document.getElementById('resultBox');

            errorMsg.style.display = 'none';
            resultBox.style.display = 'none';
            resultBox.className = "result-box"; // Reset class
            logContent.innerHTML = '';

            const md5Regex = /^[a-f0-9]{32}$/;

            if (!md5Regex.test(inputVal)) {
                errorMsg.style.display = 'block';
                return;
            }

            terminal.style.display = 'block';

            // Tốc độ lướt siêu nhanh (dưới 1 giây tổng cộng)
            printLog("Khởi tạo lõi lượng tử (Quantum Core)...", 50, () => {
                printLog("Đang nạp 32-byte Hash...", 150, () => {
                    
                    // THUẬT TOÁN 4-BLOCK XOR ĐẢM BẢO TỶ LỆ 50/50
                    // Chia 32 ký tự thành 4 khối, mỗi khối 8 ký tự
                    let block1 = parseInt(inputVal.substring(0, 8), 16);
                    let block2 = parseInt(inputVal.substring(8, 16), 16);
                    let block3 = parseInt(inputVal.substring(16, 24), 16);
                    let block4 = parseInt(inputVal.substring(24, 32), 16);

                    printLog(`Gập khối 1 & 2... <span class="highlight">[OK]</span>`, 250, () => {
                        printLog(`Gập khối 3 & 4... <span class="highlight">[OK]</span>`, 350, () => {
                            
                            // Ép 4 khối thành 1 mã Lõi duy nhất
                            let coreHash = block1 ^ block2 ^ block3 ^ block4;
                            let hexCore = Math.abs(coreHash).toString(16).toUpperCase();
                            
                            printLog(`Trích xuất mã Lõi: <span class="highlight">0x${hexCore}</span>`, 450, () => {
                                printLog("Đang đối chiếu điểm kỳ dị (Parity Check)...", 550, () => {
                                    
                                    setTimeout(() => {
                                        terminal.style.display = 'none';
                                        
                                        const predictionNode = document.getElementById('predictionText');
                                        
                                        // Tính chẵn lẻ của mã Lõi - Đảm bảo phân bổ chính xác 50%
                                        if (coreHash % 2 === 0) {
                                            predictionNode.textContent = "TÀI";
                                            resultBox.classList.add("tai");
                                            document.getElementById('statParity').textContent = "Biến thiên: CHẴN";
                                        } else {
                                            predictionNode.textContent = "XỈU";
                                            resultBox.classList.add("xiu");
                                            document.getElementById('statParity').textContent = "Biến thiên: LẺ";
                                        }
                                        
                                        document.getElementById('statHash').textContent = `Mã Lõi: 0x${hexCore.substring(0,6)}`;
                                        resultBox.style.display = 'block';
                                        
                                    }, 700);

                                });
                            });
                        });
                    });
                });
            });
        }
    </script>
</body>
</html>
