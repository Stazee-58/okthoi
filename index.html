<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MD5 Advanced Predictor PRO</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace; /* Đổi font sang dạng Hacker/Code */
        }

        body {
            background-color: #050505;
            color: #00ff00;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: #111;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.2);
            width: 100%;
            max-width: 550px;
            border: 1px solid #333;
        }

        h1 {
            color: #00ff00;
            margin-bottom: 5px;
            font-size: 22px;
            text-align: center;
            letter-spacing: 2px;
        }

        p.desc {
            color: #555;
            font-size: 12px;
            text-align: center;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 15px;
            border: 1px solid #333;
            background-color: #000;
            color: #00ff00;
            font-size: 16px;
            outline: none;
            text-align: center;
            letter-spacing: 1px;
        }

        input:focus {
            border-color: #00ff00;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.2);
        }

        button {
            width: 100%;
            padding: 15px;
            margin-top: 15px;
            background-color: #004400;
            color: #00ff00;
            border: 1px solid #00ff00;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        button:hover {
            background-color: #00ff00;
            color: #000;
        }

        /* Màn hình Terminal giả lập */
        .terminal {
            display: none;
            margin-top: 20px;
            background-color: #000;
            border: 1px solid #333;
            padding: 15px;
            height: 160px;
            overflow-y: hidden;
            font-size: 13px;
            color: #00aa00;
            text-align: left;
            line-height: 1.5;
        }

        .terminal p { margin: 5px 0; }
        .blink { animation: blink-animation 1s steps(2, start) infinite; }
        
        @keyframes blink-animation {
            to { visibility: hidden; }
        }

        /* Khung kết quả */
        .result-box {
            display: none;
            margin-top: 20px;
            padding: 20px;
            background-color: #111;
            border: 1px dashed #00ff00;
            text-align: center;
        }

        .result-box h2 {
            font-size: 45px;
            letter-spacing: 5px;
            margin-top: 10px;
        }

        .tai { color: #00ff00; text-shadow: 0 0 10px rgba(0, 255, 0, 0.5); }
        .xiu { color: #ff0044; text-shadow: 0 0 10px rgba(255, 0, 68, 0.5); }
        
        .error {
            color: #ff0044;
            margin-top: 10px;
            font-size: 13px;
            display: none;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>[ SYSTEM: MD5 ANALYZER ]</h1>
        <p class="desc">v3.0 - Neural Hash Recognition</p>

        <input type="text" id="md5Input" placeholder="Nhập MD5 Hash (32-bit)" autocomplete="off">
        
        <button onclick="startAnalysis()">Bắt đầu phân tích</button>
        
        <div id="errorMsg" class="error">ERROR: Invalid Hash Length/Format</div>

        <!-- Màn hình Console -->
        <div id="terminal" class="terminal">
            <div id="logContent"></div>
            <span class="blink">_</span>
        </div>

        <!-- Kết quả -->
        <div id="resultBox" class="result-box">
            <div style="color: #666; font-size: 12px;">>>> FINAL PREDICTION <<<</div>
            <h2 id="predictionText"></h2>
        </div>
    </div>

    <script>
        // Hàm in từng dòng log ra màn hình console
        function printLog(text, delay, callback) {
            setTimeout(() => {
                const logContent = document.getElementById('logContent');
                logContent.innerHTML += `<p>> ${text}</p>`;
                if (callback) callback();
            }, delay);
        }

        function startAnalysis() {
            const inputVal = document.getElementById('md5Input').value.trim().toLowerCase();
            const errorMsg = document.getElementById('errorMsg');
            const terminal = document.getElementById('terminal');
            const logContent = document.getElementById('logContent');
            const resultBox = document.getElementById('resultBox');

            // Reset UI
            errorMsg.style.display = 'none';
            resultBox.style.display = 'none';
            logContent.innerHTML = '';

            const md5Regex = /^[a-f0-9]{32}$/;

            if (!md5Regex.test(inputVal)) {
                errorMsg.style.display = 'block';
                return;
            }

            // Hiện terminal
            terminal.style.display = 'block';

            // Chạy hiệu ứng Log phân tích cao cấp
            printLog("Connecting to matrix algorithm...", 200, () => {
                printLog("Extracting hash: " + inputVal.substring(0, 16) + "...", 800, () => {
                    
                    // THUẬT TOÁN 1: BITWISE XOR
                    let xorSum = 0;
                    for (let i = 0; i < 32; i += 2) {
                        xorSum ^= parseInt(inputVal.substring(i, i+2), 16);
                    }
                    printLog(`Executing Bitwise XOR Folding... [Core: ${xorSum}]`, 1500, () => {
                        
                        // THUẬT TOÁN 2: POSITIONAL WEIGHT MATRIX (PWM)
                        let weightSum = 0;
                        for(let i = 0; i < 32; i++) {
                            weightSum += parseInt(inputVal[i], 16) * (i + 1);
                        }
                        printLog(`Calculating Positional Weight (PWM)... [Weight: ${weightSum}]`, 2200, () => {
                            
                            // THUẬT TOÁN 3: CHARACTER RATIO (NUM vs ALPHA)
                            let numCount = inputVal.replace(/[a-f]/g, '').length;
                            printLog(`Analyzing Entropy (Numbers: ${numCount}/32)...`, 2900, () => {
                                printLog("Decoupling final parameters...", 3600, () => {
                                    
                                    // TỔNG HỢP & XUẤT KẾT QUẢ
                                    // Trộn cả 3 biến số thuật toán để quyết định
                                    let finalScore = xorSum + weightSum + numCount;
                                    
                                    // Ẩn terminal và hiện kết quả
                                    setTimeout(() => {
                                        terminal.style.display = 'none';
                                        
                                        const predictionNode = document.getElementById('predictionText');
                                        
                                        // Tính chẵn lẻ của tổng ma trận
                                        if (finalScore % 2 === 0) {
                                            predictionNode.textContent = "TÀI";
                                            predictionNode.className = "tai";
                                            resultBox.style.border = "1px dashed #00ff00";
                                        } else {
                                            predictionNode.textContent = "XỈU";
                                            predictionNode.className = "xiu";
                                            resultBox.style.border = "1px dashed #ff0044";
                                        }
                                        
                                        resultBox.style.display = 'block';
                                    }, 4500);

                                });
                            });
                        });
                    });
                });
            });
        }
    </script>
</body>
</html>
