<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V-NEXUS: NEURAL LEARNING</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap');

        :root {
            --neon-cyan: #00f3ff;
            --neon-pink: #ff00ea;
            --neon-yellow: #ffe600;
            --neon-green: #00ff66;
            --dark-bg: #030108;
            --panel-bg: rgba(10, 15, 25, 0.85);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background-color: var(--dark-bg);
            color: var(--neon-cyan);
            font-family: 'Share Tech Mono', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
            background: radial-gradient(circle at center, #0a0614 0%, #000000 100%);
        }

        .cyber-grid {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(rgba(0, 243, 255, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 243, 255, 0.05) 1px, transparent 1px);
            background-size: 50px 50px;
            transform: perspective(1000px) rotateX(60deg) translateY(-100px) translateZ(-200px);
            animation: gridScan 15s linear infinite; z-index: 0;
        }

        @keyframes gridScan { 0% { transform: perspective(1000px) rotateX(60deg) translateY(0) translateZ(-200px); } 100% { transform: perspective(1000px) rotateX(60deg) translateY(50px) translateZ(-200px); } }

        .container {
            position: relative; z-index: 10; background: var(--panel-bg); padding: 40px; width: 100%; max-width: 700px;
            border: 1px solid rgba(0, 243, 255, 0.2); backdrop-filter: blur(12px);
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.05), inset 0 0 20px rgba(0, 243, 255, 0.05);
        }

        .hud-corner { position: absolute; width: 20px; height: 20px; border: 2px solid var(--neon-cyan); }
        .top-left { top: -2px; left: -2px; border-right: none; border-bottom: none; }
        .top-right { top: -2px; right: -2px; border-left: none; border-bottom: none; }
        .bottom-left { bottom: -2px; left: -2px; border-right: none; border-top: none; }
        .bottom-right { bottom: -2px; right: -2px; border-left: none; border-top: none; }

        h1 { font-family: 'Orbitron', sans-serif; color: #fff; font-size: 34px; text-align: center; margin-bottom: 5px; letter-spacing: 5px; text-shadow: 0 0 15px var(--neon-cyan); font-weight: 900; }
        .subtitle { text-align: center; font-size: 12px; color: var(--neon-yellow); margin-bottom: 35px; letter-spacing: 4px; font-family: 'Orbitron', sans-serif; text-transform: uppercase; }

        .input-wrapper { display: flex; align-items: center; background: rgba(0, 0, 0, 0.7); border: 1px solid var(--neon-cyan); padding: 0 20px; margin-bottom: 25px; transition: all 0.3s; box-shadow: inset 0 0 15px rgba(0, 243, 255, 0.1); }
        .input-wrapper:focus-within { box-shadow: 0 0 20px rgba(0, 243, 255, 0.3), inset 0 0 10px rgba(0, 243, 255, 0.1); border-color: var(--neon-cyan); }
        .input-icon { color: var(--neon-cyan); font-weight: bold; font-size: 20px; margin-right: 15px; }
        
        input { flex: 1; background: transparent; border: none; padding: 20px 0; color: #fff; font-size: 18px; font-family: 'Share Tech Mono', monospace; outline: none; text-transform: uppercase; letter-spacing: 2px; }

        button { width: 100%; padding: 18px; background: rgba(0, 243, 255, 0.1); color: var(--neon-cyan); border: 1px solid var(--neon-cyan); font-size: 18px; font-family: 'Orbitron', sans-serif; font-weight: 700; cursor: pointer; transition: all 0.3s; text-transform: uppercase; letter-spacing: 3px; }
        button:hover { background: var(--neon-cyan); color: #000; box-shadow: 0 0 25px var(--neon-cyan); transform: translateY(-2px); }

        .analyzer-screen { display: none; margin-top: 30px; background: #020104; border: 1px solid #1a0f2e; padding: 20px; height: 200px; overflow-y: hidden; position: relative; box-shadow: inset 0 0 30px rgba(0,0,0,1); }
        .code-lines { font-size: 13px; color: var(--neon-cyan); line-height: 1.5; z-index: 1; position: relative; }
        .log-warn { color: var(--neon-yellow); font-weight: bold; }
        .log-sys { color: var(--neon-cyan); }
        .log-err { color: var(--neon-pink); text-shadow: 0 0 5px var(--neon-pink);}
        .log-succ { color: var(--neon-green); text-shadow: 0 0 5px var(--neon-green);}

        .result-container { display: none; margin-top: 30px; text-align: center; padding: 30px 10px; background: rgba(0,0,0,0.6); border: 1px solid #222; position: relative; box-shadow: inset 0 0 20px rgba(0,0,0,0.8); border-top: 3px solid var(--neon-cyan); }
        .result-title { font-family: 'Share Tech Mono', monospace; font-size: 14px; color: #888; margin-bottom: 15px; letter-spacing: 2px; }
        .result-value { font-family: 'Orbitron', sans-serif; font-size: 55px; font-weight: 900; letter-spacing: 6px; transition: color 0.3s; }
        
        .val-tai { color: var(--neon-cyan); text-shadow: 0 0 15px var(--neon-cyan); }
        .val-xiu { color: var(--neon-pink); text-shadow: 0 0 15px var(--neon-pink); }

        /* Vùng nút Training Feedback */
        .feedback-section { display: none; margin-top: 25px; padding-top: 25px; border-top: 1px dashed rgba(255,255,255,0.1); }
        .feedback-title { font-size: 13px; color: #aaa; margin-bottom: 15px; text-align: center; letter-spacing: 1px; }
        .btn-group { display: flex; gap: 15px; }
        
        .btn-correct { background: rgba(0, 255, 102, 0.1); color: var(--neon-green); border-color: var(--neon-green); }
        .btn-correct:hover { background: var(--neon-green); color: #000; box-shadow: 0 0 20px var(--neon-green); }
        
        .btn-incorrect { background: rgba(255, 0, 234, 0.1); color: var(--neon-pink); border-color: var(--neon-pink); }
        .btn-incorrect:hover { background: var(--neon-pink); color: #000; box-shadow: 0 0 20px var(--neon-pink); }

        .stats { display: flex; justify-content: space-between; font-size: 12px; color: #777; margin-top: 20px; font-family: 'Share Tech Mono', monospace; }
        .stats span { color: #fff; font-weight: bold; }
    </style>
</head>
<body>
    <div class="cyber-grid"></div>

    <div class="container">
        <div class="hud-corner top-left"></div><div class="hud-corner top-right"></div>
        <div class="hud-corner bottom-left"></div><div class="hud-corner bottom-right"></div>

        <h1>V-NEXUS CORE</h1>
        <div class="subtitle">NEURAL MACHINE LEARNING - SELF TRAINING</div>
        
        <div class="input-wrapper">
            <span class="input-icon">_></span>
            <input type="text" id="md5Input" placeholder="NHẬP MÃ MD5 CẦN PHÂN TÍCH" maxlength="32">
        </div>
        
        <button onclick="executeLogic()" id="btnExecute">CHẠY THUẬT TOÁN</button>

        <div class="analyzer-screen" id="analyzerScreen">
            <div id="codeConsole" class="code-lines"></div>
        </div>

        <div id="finalOutput" class="result-container">
            <div class="result-title">DỰ ĐOÁN AI (PREDICTION)</div>
            <div id="resTaiXiu" class="result-value"></div>
            
            <div class="stats">
                <div>NGUỒN (SOURCE): <span id="statMatch">TÍNH TOÁN MỚI</span></div>
                <div>HEX-WEIGHT: <span id="statWeight">0</span></div>
            </div>

            <!-- Khu vực Dạy AI -->
            <div class="feedback-section" id="feedbackSection">
                <div class="feedback-title">XÁC NHẬN KẾT QUẢ ĐỂ TRAIN AI</div>
                <div class="btn-group">
                    <button onclick="sendFeedback(true)" class="btn-correct">✓ ĐÚNG</button>
                    <button onclick="sendFeedback(false)" class="btn-incorrect">✗ SAI (ĐẢO NGƯỢC)</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Khởi tạo/Lấy dữ liệu LocalStorage (Bộ nhớ AI)
        let aiMemory = JSON.parse(localStorage.getItem('vnexus_ai_dataset')) || {};
        
        let currentMd5 = "";
        let currentPrediction = "";

        function pushLog(text, type = "sys") {
            const cons = document.getElementById('codeConsole');
            cons.innerHTML += `<div class="log-${type}">[${(new Date()).toISOString().substring(11,19)}] ${text}</div>`;
            cons.scrollTop = cons.scrollHeight;
        }

        const sleep = ms => new Promise(r => setTimeout(r, ms));

        async function executeLogic() {
            const inputVal = document.getElementById('md5Input').value.trim().toLowerCase();
            if (inputVal.length !== 32) {
                alert("LỖI: Mã MD5 phải đủ 32 ký tự.");
                return;
            }

            currentMd5 = inputVal;

            document.getElementById('btnExecute').style.display = 'none';
            document.getElementById('finalOutput').style.display = 'none';
            document.getElementById('feedbackSection').style.display = 'none';
            document.getElementById('analyzerScreen').style.display = 'block';
            document.getElementById('codeConsole').innerHTML = "";

            pushLog("KẾT NỐI VÀO BỘ NHỚ LÕI NEURAL...", "sys");
            await sleep(400);

            let isMatched = false;
            let hexWeightSum = 0;

            // KIỂM TRA BỘ NHỚ
            if (aiMemory[currentMd5]) {
                pushLog(`[!] TÌM THẤY DỮ LIỆU ĐÃ HỌC TỪ VÁN TRƯỚC!`, "succ");
                await sleep(500);
                pushLog(`-> Đang truy xuất kết quả chính xác từ Local Storage...`, "sys");
                
                currentPrediction = aiMemory[currentMd5];
                isMatched = true;
                hexWeightSum = "LƯU TRỮ TRONG BỘ NHỚ";
            } else {
                pushLog("Mã mới tinh. Bắt đầu tính toán Hex-Weight...", "sys");
                await sleep(400);
                
                for(let i = 0; i < currentMd5.length; i++) {
                    let val = parseInt(currentMd5[i], 16);
                    hexWeightSum += val;
                }

                pushLog(`Tổng Hex-Weight: ${hexWeightSum}`, "warn");
                await sleep(400);
                
                // Thuật toán mặc định (Bạn có thể đổi lẻ/chẵn tùy ý)
                if (hexWeightSum % 2 !== 0) {
                    currentPrediction = "TÀI";
                } else {
                    currentPrediction = "XỈU";
                }
                pushLog(`Thuật toán thô kết luận: ${currentPrediction}`, "sys");
            }

            await sleep(600);
            
            // Render kết quả
            document.getElementById('analyzerScreen').style.display = 'none';
            document.getElementById('finalOutput').style.display = 'block';
            
            updateResultUI(currentPrediction);
            
            document.getElementById('statMatch').textContent = isMatched ? "MEMORY (ĐÃ HỌC)" : "CALCULATION (MỚI)";
            document.getElementById('statWeight').textContent = hexWeightSum;

            // Hiện nút feedback để Train AI
            document.getElementById('feedbackSection').style.display = 'block';
        }

        function updateResultUI(result) {
            const txNode = document.getElementById('resTaiXiu');
            txNode.textContent = result;
            txNode.className = result === "TÀI" ? "result-value val-tai" : "result-value val-xiu";
        }

        // CƠ CHẾ TRAIN AI VÀ GHI LOG (LOCAL STORAGE)
        function sendFeedback(isCorrect) {
            let finalLearnedResult = currentPrediction;

            if (!isCorrect) {
                // Đảo ngược kết quả nếu đoán sai
                finalLearnedResult = currentPrediction === "TÀI" ? "XỈU" : "TÀI";
                updateResultUI(finalLearnedResult);
                
                document.getElementById('analyzerScreen').style.display = 'block';
                pushLog(`ĐÃ ĐẢO NGƯỢC KẾT QUẢ THÀNH: ${finalLearnedResult}`, "err");
            } else {
                document.getElementById('analyzerScreen').style.display = 'block';
                pushLog(`GHI NHẬN CHÍNH XÁC. GIỮ NGUYÊN KẾT QUẢ: ${finalLearnedResult}`, "succ");
            }

            // LƯU VÀO TRÌNH DUYỆT CỦA BẠN
            aiMemory[currentMd5] = finalLearnedResult;
            localStorage.setItem('vnexus_ai_dataset', JSON.stringify(aiMemory));
            
            pushLog("Đã lưu Database thành công! Sẵn sàng cho ván sau.", "sys");

            // Đổi UI sang trạng thái chờ nhập mã mới
            document.getElementById('feedbackSection').style.display = 'none';
            document.getElementById('btnExecute').style.display = 'block';
            document.getElementById('btnExecute').textContent = "PHÂN TÍCH MÃ TIẾP THEO";
            document.getElementById('md5Input').value = ""; // Xóa ô nhập liệu
        }
    </script>
</body>
</html>
